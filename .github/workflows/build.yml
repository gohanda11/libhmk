name: Build Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, split]
    paths:
      - "setup.py"
      - "requirements.txt"
      - "hardware/**"
      - "include/**"
      - "keyboards/**"
      - "linker/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci_define_matrix.py"
  push:
    branches: [main, dev, split]
    paths:
      - "setup.py"
      - "requirements.txt"
      - "hardware/**"
      - "include/**"
      - "keyboards/**"
      - "linker/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ci_define_matrix.py"
    tags: ["v*"]

permissions:
  contents: write

jobs:
  define-matrix:
    name: Define Action Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    steps:
      - name: Checkout libhmk
        uses: actions/checkout@v6

      - name: Generate Matrix
        id: define-matrix
        run: |
          MATRIX_JSON=$(python .github/workflows/ci_define_matrix.py)
          echo "matrix=$MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Firmware
    needs: define-matrix
    strategy:
      matrix:
        include: ${{ fromJson(needs.define-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libhmk
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup PlatformIO Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.keyboard }}
        run: |
          python setup.py -k ${{ matrix.keyboard }}
          pio run

      - name: Archive Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.keyboard }}
          path: |
            .pio/build/${{ matrix.keyboard }}/firmware.bin
            .pio/build/${{ matrix.keyboard }}/firmware.elf

  publish-firmware:
    name: Publish Firmware to firmware Branch
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout or Create firmware Branch
        run: |
          git init firmware-repo
          cd firmware-repo
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin firmware || true
          if git rev-parse --verify origin/firmware >/dev/null 2>&1; then
            git checkout -b firmware origin/firmware
          else
            git checkout --orphan firmware
            git rm -rf . || true
          fi

      - name: Organize Firmware Files
        run: |
          cd firmware-repo
          for dir in ../artifacts/firmware-*/; do
            keyboard=$(basename "$dir" | sed 's/^firmware-//')
            mkdir -p "$keyboard"
            cp "$dir"firmware.bin "$keyboard/firmware.bin"
          done

      - name: Generate Manifest
        run: |
          cd firmware-repo
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          keyboards = []
          for name in sorted(os.listdir('.')):
              if os.path.isdir(name) and os.path.exists(os.path.join(name, 'firmware.bin')):
                  size = os.path.getsize(os.path.join(name, 'firmware.bin'))
                  keyboards.append({
                      "keyboard": name,
                      "url": f"https://raw.githubusercontent.com/${{ github.repository }}/firmware/{name}/firmware.bin",
                      "size": size,
                      "branch": "main",
                      "commit": "${{ github.sha }}",
                      "built_at": datetime.now(timezone.utc).isoformat()
                  })

          manifest = {
              "repository": "${{ github.repository }}",
              "branch": "main",
              "commit": "${{ github.sha }}",
              "built_at": datetime.now(timezone.utc).isoformat(),
              "firmwares": keyboards
          }

          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Commit and Push
        run: |
          cd firmware-repo
          git add -A
          git commit -m "Update firmware from main @ ${{ github.sha }}" || true
          git push origin firmware

  release:
    name: Create Releast Draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*

      - name: Zip Firmware Binaries
        run: zip -r firmware.zip firmware-*

      - name: Create Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: firmware.zip
